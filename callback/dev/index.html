<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tesla Auth Callback (Dev)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
    <h1 id="status">認証処理中...</h1>
    <p>MyTesla (Dev) に戻ってください。</p>
    
    <a id="app-link" href="#" 
       style="display: inline-block; padding: 15px 30px; background-color: #e31937; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 20px;">
        アプリを開く
    </a>

    <script>
        // URLパラメータを取得
        const search = window.location.search;
        const PACKAGE = "com.example.myteslawearapp.dev";
        const PATH = "/callback/dev";

        const urlParams = new URLSearchParams(search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');

        // パッケージを明示した Intent URL。素の myteslawearapp:// を先に投げると
        // 別フレーバー (Dev) の古い debug ビルドがスキームを奪い、Prod でログイン
        // したのに Dev が起動する事故になる (2026-08-20 実測) ため使わない。
        const intentUrl = "intent://rintaro-ko.github.io" + PATH + search +
            "#Intent;scheme=https;package=" + PACKAGE + ";end";

        if (code) {
            document.getElementById('status').innerText = "認証完了";
        } else if (error) {
            document.getElementById('status').innerText = "認証エラー";
        }

        document.getElementById('app-link').href = intentUrl;
        setTimeout(() => { window.location.href = intentUrl; }, 500);
    </script>
</body>
</html>
